<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curhat Teman</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            background: #2c2c2c;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }

        header img {
            max-width: 100px;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2em;
            color: #00ffcc;
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #2c2c2c;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            animation: slideUp 0.8s ease-out;
            border: 2px solid #00ffcc;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #00ffcc;
            font-weight: 500;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            background: #3d3d3d;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        textarea {
            height: 150px;
            resize: none;
        }

        textarea:focus, input:focus {
            outline: none;
            box-shadow: 0 0 5px #00ffcc;
            background: #4a4a4a;
        }

        .error {
            color: #ff4d4d;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            color: #1a1a1a;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: #00e6b8;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #888;
            font-size: 0.9em;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 20px;
            }

            header h1 {
                font-size: 1.5em;
            }

            button {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="img/1.jpeg" alt="Logo penting">
        <h1>arsip negara</h1>
    </header>

    <div class="form-container" id="question1">
        <div class="form-group">
            <label for="essay1">1. plan apa yang anda punya untuk TI polteksi kedepanya dengan fasilitas yang sudah dijelaskan dosen dosen sekalian(direkomendasikan bersama,bukan individu)</label>
            <textarea id="essay1" name="essay1" required></textarea>
            <div class="error" id="essay1Error">jok dikosongi puki</div>
        </div>
        <button onclick="nextQuestion(1)">Next</button>
    </div>

    <div class="form-container hidden" id="question2">
        <div class="form-group">
            <label for="essay2">2.plan apa yang anda punya untuk TI polteksi jika ternyata fasilitas dari awal masuk sampai seterusnya (lulus)tidak ada yang berubah(direkomendasikan bersama,bukan individu)</label>
            <textarea id="essay2" name="essay2" required></textarea>
            <div class="error" id="essay2Error">jok dikosongi puki</div>
        </div>
        <button onclick="nextQuestion(2)">Next</button>
    </div>

    <div class="form-container hidden" id="identity">
        <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" name="name" required>
            <div class="error" id="nameError">jok dikosongi puki</div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <div class="error" id="emailError">Email tidak valid puki</div>
        </div>
        <div class="form-group">
            <label for="aspiration">mau jadi apa di masa depan(jawaban individu boleh,bersama boleh)</label>
            <textarea id="aspiration" name="aspiration" required></textarea>
            <div class="error" id="aspirationError">jok dikosongi puki</div>
        </div>
        <button onclick="nextQuestion(3)">Next</button>
    </div>

    <footer>
        everything is ok
    </footer>

    <!-- Tambahkan EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        // Inisialisasi EmailJS dengan Public Key
        (function(){
            emailjs.init("EO5oTo-thw3OIoZyy");
        })();

        let responses = {};

        function nextQuestion(step) {
            if (step === 1) {
                const essay1 = document.getElementById('essay1').value.trim();
                if (!essay1) {
                    document.getElementById('essay1Error').style.display = 'block';
                    return;
                }
                responses.essay1 = essay1;
                document.getElementById('question1').classList.add('hidden');
                document.getElementById('question2').classList.remove('hidden');
            } else if (step === 2) {
                const essay2 = document.getElementById('essay2').value.trim();
                if (!essay2) {
                    document.getElementById('essay2Error').style.display = 'block';
                    return;
                }
                responses.essay2 = essay2;
                document.getElementById('question2').classList.add('hidden');
                document.getElementById('identity').classList.remove('hidden');
            } else if (step === 3) {
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const aspiration = document.getElementById('aspiration').value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                let isValid = true;

                if (!name) {
                    document.getElementById('nameError').style.display = 'block';
                    isValid = false;
                }
                if (!email || !emailRegex.test(email)) {
                    document.getElementById('emailError').style.display = 'block';
                    isValid = false;
                }
                if (!aspiration) {
                    document.getElementById('aspirationError').style.display = 'block';
                    isValid = false;
                }

                if (isValid) {
                    responses.name = name;
                    responses.email = email;
                    responses.aspiration = aspiration;
                    sessionStorage.setItem('responses', JSON.stringify(responses));
                    window.location.href = 'summary.html';
                }
            }
        }
    </script>
</body>
</html>
