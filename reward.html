<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reward</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        header {
            background: #2c2c2c;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }

        header img {
            max-width: 100px;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2em;
            color: #00ffcc;
        }

        .reward-container {
            max-width: 600px;
            margin: 0 auto;
            background: #2c2c2c;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            text-align: center;
            animation: slideUp 0.8s ease-out;
            border: 2px solid #00ffcc;
        }

        .cartoon {
            width: 200px;
            height: 200px;
            background: url('https://via.placeholder.com/200?text=Cartoon') no-repeat center;
            background-size: contain;
            margin: 0 auto;
            animation: bounce 2s infinite;
        }

        .copyable-text {
            background: #3d3d3d;
            padding: 10px;
            border-radius: 8px;
            margin: 20px 0;
            cursor: pointer;
        }

        .copyable-text:hover {
            background: #4a4a4a;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #888;
            font-size: 0.9em;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @media (max-width: 480px) {
            .reward-container {
                padding: 20px;
            }

            header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="img/1.jpeg" alt="Logo penting">
        <h1>Reward</h1>
    </header>

    <div class="reward-container">
        <div class="cartoon"></div>
        <p>Terima kasih telah berbagi! Salin link berikut untuk kejutan:</p>
        <div class="copyable-text" id="copyText" onclick="copyLink()">https://link.dana.id/danakaget?c=stzapsjer&r=iFcjfd&orderId=20250502101214977815010300166377921096432</div>
        <p>(sat set bukak)</p>
    </div>

    <footer>
        ss misal ole reward kirim nk aku 
    </footer>

    <script>
        function copyLink() {
            const text = document.getElementById('copyText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Link telah disalin!');
            });
        }
    </script>
</body>
</html>
